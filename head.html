<!-- ================================================================
     work.flowers — Bullet.so global HEAD code
     ================================================================
     THIS IS A TEMPLATE, NOT THE PASTE. {{SHA}} below is substituted
     with a real commit SHA by scripts/bullet-head.sh, which prints
     the block to paste and puts it on the clipboard:

         scripts/bullet-head.sh              # origin/main
         scripts/bullet-head.sh <sha|ref>    # anything else

     Paste the whole output into Bullet -> Settings -> Custom Code ->
     Head, replacing everything already there, then run
     scripts/verify-live.py. Nothing in this block should ever be
     hand-edited in the Bullet dashboard: edit this file, merge, and
     re-run the generator.

     Write real characters here -- the em dashes below are real em
     dashes. The generator escapes every non-ASCII character in the
     JSON-LD as \uXXXX on the way out, so what you paste is pure
     ASCII. That is deliberate: on 6 Sep 2026 these two em dashes
     reached the live site as CP1252 mojibake, decoded as the wrong
     charset somewhere between the clipboard and the Bullet form.
     Bullet stores UTF-8 correctly -- the old footer paste carried
     the same character for months -- but the journey does not, and
     a \u escape cannot be mangled that way.

     WHY SHA PINS AND NOT @main. jsDelivr serves a branch ref with
     cache-control: max-age=604800, s-maxage=43200, against
     max-age=31536000, immutable for a SHA. A moving ref means
     returning visitors keep stale CSS for up to a week, and the
     purge API cannot reach a browser cache. Keep the pins; the fix
     for mistyping them is to stop typing them, not to drop them.

     ---- WHAT IS IN HERE AND WHY ---------------------------------

     Fonts (SEO audit M-01, TKT-850). One request, not three. The
     weights are the ones the stylesheet actually sets:
       Inter          400, 500, 600, 700, 800
       JetBrains Mono 400, 500, 600, 700
     The @import that used to sit in charm_style_sheet.css and the
     malformed one in jtbd_widget.html are both gone: an @import
     inside a stylesheet cannot start until that stylesheet has
     downloaded, serialising the font request behind the CSS.

     charm_style_sheet.css — the site stylesheet.

     bullet_bundle.js — every piece of runtime behaviour on the site
     (GA4, JSON-LD, the noindex rules, the H1 retag, the /about-us/
     testimonial widget). Replaces the old 38 KB footer paste and the
     separate /about-us/ filed_index.js pin. `defer` runs it after
     the document parses, which is where the footer paste ran anyway.

     Organization / ProfessionalService JSON-LD — audit C-05. Kept
     here as literal markup rather than folded into the bundle, so
     it is server-rendered. Injecting the site's primary entity from
     JavaScript would make Google's view of it depend on a render
     pass that is delayed and not guaranteed.

     The agent-embed <script> is the chat widget. It is not ours and
     has no repo copy; it is reproduced verbatim so that the paste is
     complete and nothing survives in Bullet by accident.
     ================================================================ -->
